  <style>
    :root{--paper:#efe5c3;--ink:#211d16;--red:#7d3026;--gold:#8a6723}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Libre Baskerville",Georgia,serif;background:#d9cfad;background-image:radial-gradient(#594f381c .65px,transparent .8px);background-size:4px 4px}.topbar{padding:12px clamp(18px,4vw,60px);color:var(--paper);background:#211d16;border-block:4px double #cdbf93;text-transform:uppercase;font-size:10px;letter-spacing:.18em}.page{width:min(960px,calc(100% - 32px));margin:42px auto;padding:clamp(28px,6vw,70px);text-align:center;background:rgba(239,229,195,.97);border:5px double #342d21;box-shadow:9px 11px 0 #72684e}.kicker{margin:0;color:var(--red);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.page h1{margin:8px 0 18px;font-family:"IM Fell English",Georgia,serif;font-size:clamp(54px,9vw,92px);line-height:1}.rule{width:120px;height:5px;margin:24px auto;border-block:1px solid var(--gold)}.message{max-width:620px;margin:0 auto;font-size:17px;line-height:1.8}.placeholder{margin:38px auto 0;padding:26px;border:4px double var(--gold);background:#e4d8b4}.placeholder strong{display:block;font-family:"IM Fell English",Georgia,serif;font-size:30px}.placeholder span{display:block;margin-top:8px;color:#6e5e3b;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}.back{display:inline-block;margin-top:32px;padding:10px 13px;color:var(--paper);background:var(--ink);text-decoration:none;text-transform:uppercase;font-size:9px;font-weight:700;letter-spacing:.14em}@media(max-width:700px){.page{margin:18px auto}}

</head>
