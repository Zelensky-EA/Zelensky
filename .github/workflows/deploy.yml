name: Deploy unified science navigator
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: ap-biology
      - run: npm run build
        working-directory: ap-biology
        env:
          VITE_NAVIGATOR_CSV_URL: ${{ vars.VITE_NAVIGATOR_CSV_URL }}
      - run: |
          mkdir -p _site/ap-biology _site/anatomy-physiology
          cp index.html other-resources.html talontech-club.html portal.css landing-field.jpg _site/
          touch _site/.nojekyll
          cp -R ap-biology/dist/. _site/ap-biology/
          cp -R anatomy-physiology/. _site/anatomy-physiology/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
  
